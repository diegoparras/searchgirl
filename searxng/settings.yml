# settings.yml de SearXNG para Searchgirl.
#
# SearXNG corre como servicio INTERNO (sin puerto publicado al host): solo
# Searchgirl le habla. Por eso el limiter va apagado y el formato json
# habilitado — sin json, la API devuelve 403 y Searchgirl no funciona.
use_default_settings: true

general:
  # Wikipedia, Wikidata y OpenStreetMap no cargan sin un contacto: la política
  # de Wikimedia pide que cada instancia se identifique. Por defecto va la URL
  # del proyecto; quien opere una instancia puede poner la suya con la variable
  # SEARXNG_CONTACT_URL, que tiene prioridad sobre este valor.
  contact_url: https://github.com/diegoparras/searchgirl

server:
  limiter: false
  image_proxy: true
  # secret_key se toma de la env SEARXNG_SECRET (ver docker-compose.yml)

search:
  formats:
    - html
    - json
  autocomplete: duckduckgo
  safe_search: 0
  default_lang: auto

ui:
  static_use_hash: true

# --- Motores de la categoría General -----------------------------------------
#
# DuckDuckGo, Bing y Google CSE rechazan las búsquedas que llegan desde la IP de
# un datacenter (un VPS): devuelven captcha o 403 y en Searchgirl aparecen como
# "sin respuesta", con General en 0 resultados mientras Noticias anda. Desde
# una conexión hogareña responden bien.
#
# Por eso esos motores salen por la red "residencial". Así como viene, esa red
# no tiene proxy y sale directo: en tu máquina funciona igual que siempre. En un
# VPS, descomentá la línea de proxies y poné la URL de tu proxy residencial
# (la misma que usás en HTTPS_PROXY en otras apps). Va sólo en el settings.yml
# del servidor, nunca en el repo: SearXNG no lee el proxy de una variable de
# entorno. Ver DEPLOY.md, "General en 0 resultados en un VPS".
#
# Wikipedia y Wikidata son APIs que no bloquean y salen directo, sin gastar
# tráfico del proxy.
outgoing:
  request_timeout: 5.0
  max_request_timeout: 15.0
  networks:
    residencial:
      # Si un pedido falla, se repite una vez. Cada intento toma el proxy
      # siguiente de la lista: con dos proxies, el reintento sale por el otro;
      # con uno que rota la IP, sale con otra IP.
      retries: 1
      # Sin esto SearXNG sólo reintenta cuando no conecta. Con esto también
      # reintenta cuando el buscador responde con un bloqueo.
      retry_on_http_error: [403, 429, 503]
      # Un proxy:
      # proxies: http://USUARIO:CLAVE@HOST:PUERTO
      # Varios, que se turnan pedido a pedido:
      # proxies:
      #   all://:
      #     - http://USUARIO:CLAVE@HOST1:PUERTO
      #     - http://USUARIO:CLAVE@HOST2:PUERTO

# Los motores se declaran acá, y no se dejan a los valores por defecto, para
# que General no cambie de motores al actualizar la imagen de SearXNG.
#
# Quedan afuera, probados el 2026-11-24 con SearXNG 2026.11.23:
#   - google: 403 incluso desde una IP hogareña (por eso SearXNG lo apaga).
#   - brave: 429 en la primera búsqueda, también desde una IP hogareña.
#   - startpage y mojeek: piden un captcha de prueba de trabajo y SearXNG los
#     desactiva.
# Prenderlos no suma resultados y deja "sin respuesta" en cada búsqueda. Con un
# proxy residencial se pueden probar: disabled: false y network: residencial.
#
# DuckDuckGo va dos veces porque son dos puertas distintas: "duckduckgo" usa
# html.duckduckgo.com (sin JavaScript) y "duckduckgo web" la API d.js que usa
# el navegador. Desde algunas IPs de proxy una tira captcha y la otra no.
# Yahoo suma un frente más para no depender sólo de Bing.
#
# Descartados además (probados el 2026-11-24): qwant, fireball y searchmysite
# (access denied), yep (HTTP error), quark (crash), baidu (parsing error),
# privacywall (es Bing por detrás), yandex (captchas, resultados sesgados) y
# wiby (índice chico de webs personales). Segunda ronda: fastbot, zapmeta y
# dogpile (access denied), startpage (CAPTCHA), wikimini (too many requests),
# encyclosearch y yacy (timeout), gabanza (certificado inválido), reloado y
# resulthunter (crash), tusksearch y wolframalpha (HTTP error), crowdview y
# vuhuv (0 resultados). naver (buscador coreano) y fynd respondieron, pero con
# una sola búsqueda no alcanza para sumarlos.
#
# Con API key (pago por consulta, no bloquean IPs) existen braveapi, kagi,
# exaapi, marginalia y yandex_api: se agregan con su engine y su api_key.
engines:
  - name: duckduckgo
    disabled: false
    network: residencial
  - name: duckduckgo web
    disabled: false
    categories: [general, web]
    network: residencial
  - name: bing
    disabled: false
    network: residencial
  - name: yahoo
    disabled: false
    network: residencial
  # Mojeek tiene índice propio (no es Google ni Bing por detrás). SearXNG lo
  # marca inactivo porque a veces pide un captcha de prueba de trabajo; el
  # 2026-11-24 respondía bien. Si queda "sin respuesta" casi siempre, se apaga
  # con disabled: true.
  - name: mojeek
    disabled: false
    inactive: false
    network: residencial
  - name: google cse
    network: residencial
  # Imágenes: Google CSE también bloquea la IP del VPS en esta categoría.
  - name: google cse images
    network: residencial
  - name: google
    disabled: true
  - name: brave
    disabled: true
  - name: wikidata
    # La consulta SPARQL de Wikidata tarda; con 3 s (el valor por defecto)
    # se corta seguido y figura como "sin respuesta".
    timeout: 6.0
