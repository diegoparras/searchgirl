name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          # 'stable' = última patch (stdlib parcheada). go.mod solo fija el
          # mínimo; usar la exacta dejaría CVEs de stdlib en el binario.
          go-version: stable
      - run: go vet ./...
      - run: go test ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  image:
    # Publica ghcr.io/diegoparras/searchgirl en cada push a main (:latest +
    # :X.Y.Z de la constante version + Release vX.Y.Z con las notas de esa
    # version del CHANGELOG.md) y en cada tag v* (:X.Y.Z + :X.Y). Los PRs solo
    # corren tests. Cada version dice que cambia: sin su seccion en el
    # CHANGELOG la imagen no sale.
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # crear el tag y el Release de la version
      packages: write # solo este job publica la imagen a GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
      - name: Version y novedades (CHANGELOG)
        id: ver
        run: |
          V="$(go run ./cmd/searchgirl notas -version)"
          go run ./cmd/searchgirl notas > "$RUNNER_TEMP/notas.md"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          {
            echo "## Searchgirl v$V"
            echo
            cat "$RUNNER_TEMP/notas.md"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/diegoparras/searchgirl
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.ver.outputs.version }},enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Release de la version
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "::warning::La v$V ya estaba publicada: este deploy no subio la version (patch) ni sumo novedades."
          else
            gh release create "v$V" --target "$GITHUB_SHA" --title "Searchgirl v$V" --notes-file "$RUNNER_TEMP/notas.md"
          fi
